name: Android CI

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/json-viewer-${GITHUB_REF_NAME#v}.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/json-viewer-debug.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: json-viewer-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: JSON 查看器 ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
